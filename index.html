<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>Modern Dream Villa VR - A-Frame</title>

    <script
        src="https://unpkg.com/aframe-environment-component@1.3.0/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <!-- ========== CUSTOM WATER ANIMATION & MODERN TEXTURE GENERATOR ========== -->
    <script>
        // Water animation component (offsets texture for flow)
        AFRAME.registerComponent('water-animation', {
            schema: { speed: { type: 'number', default: 0.02 } },
            tick: function (t, dt) {
                const mesh = this.el.getObject3D('mesh');
                if (!mesh) return;
                const material = mesh.material;
                if (!material.map) return;

                material.map.offset.x += this.data.speed * dt / 1000;
                material.map.offset.y += (this.data.speed * 0.5) * dt / 1000;
                material.map.needsUpdate = true;
            }
        });

        // Simple concrete texture generator (canvas based) for modern walls
        AFRAME.registerComponent('concrete-wall', {
            schema: { color: { type: 'color', default: '#b0b0b0' } },
            init: function () {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                // Base color
                ctx.fillStyle = this.data.color;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // Add subtle grain / aggregate dots
                ctx.fillStyle = '#a0a0a0';
                for (let i = 0; i < 2000; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(80,80,80,${Math.random() * 0.3})`;
                    ctx.fill();
                }
                // Add some fine lines
                ctx.strokeStyle = '#909090';
                ctx.lineWidth = 1;
                for (let i = 0; i < 50; i++) {
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * canvas.width, 0);
                    ctx.lineTo(Math.random() * canvas.width, canvas.height);
                    ctx.strokeStyle = `rgba(100,100,100,0.15)`;
                    ctx.stroke();
                }
                const texture = new THREE.CanvasTexture(canvas);
                this.el.setAttribute('material', 'src', texture);
                this.el.setAttribute('material', 'repeat', '2 2');
            }
        });
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

                    <a-cylinder radius="0.03" height="0.4" color="#ccc" material="metalness: 0.9"></a-cylinder>
                    <a-cylinder position="0 0.2 0.1" radius="0.03" height="0.2" rotation="90 0 0" color="#ccc"
                        material="metalness: 0.9"></a-cylinder>
                </a-entity>
            </a-entity>

            <!-- Accessories / Utensils -->
            <a-entity id="utensils" position="-4.5 1.2 1.5">
                <a-cylinder position="0 0.05 0" radius="0.15" height="0.1" color="#fff"></a-cylinder> <!-- Plate -->
                <a-cylinder position="0 0.15 0" radius="0.15" height="0.1" color="#eee"></a-cylinder> <!-- Plate -->
                <a-box position="0 0.2 0.4" width="0.02" height="0.4" depth="0.05" color="#888"></a-box>
                <!-- Knife (stand) -->
            </a-entity>

            <!-- Modern island -->
            <a-entity id="island" position="1.5 0.0 0">
                <a-box position="0 0.55 0" width="1.8" height="1.1" depth="2.5" color="#222" shadow></a-box>
                <a-box position="0 1.12 0" width="2.0" height="0.05" depth="2.7" color="#fff"
                    material="roughness: 0.1"></a-box>
            </a-entity>

            <!-- Refrigerator with fridge.jpg -->
            <a-entity id="modern-fridge" position="4 0 1">
                <a-box position="0 1.2 0" width="1.4" height="2.4" depth="1.1"
                    material="src: #fridge-tex; roughness: 0.3; metalness: 0.5" shadow></a-box>
                <!-- Handles -->
                <a-box position="-0.6 1.8 0.6" width="0.05" height="0.8" depth="0.02" color="#ccc"></a-box>
                <a-box position="-0.6 0.8 0.6" width="0.05" height="0.6" depth="0.02" color="#ccc"></a-box>
            </a-entity>

        </a-entity>

        <!-- DINING AREA (Now separated/transitional) -->
        <a-entity id="dining-area" position="0 0.21 -2">
            <!-- Hanging pendant lights -->
            <a-entity position="-1 4.5 2">
                <a-sphere radius="0.2" color="#fff5e0"></a-sphere>
                <a-light type="point" intensity="0.5" distance="4" color="#fed"></a-light>
            </a-entity>
            <a-entity position="1 4.5 2">
                <a-sphere radius="0.2" color="#fff5e0"></a-sphere>
                <a-light type="point" intensity="0.5" distance="4" color="#fed"></a-light>
            </a-entity>
        </a-entity>

        <!-- ========== OUTDOOR FEATURES ========== -->

        <!-- SEA BLUE POOL with water animation (Relocated to Right Side) -->
        <a-entity id="swimming-pool" position="18 0.1 0" rotation="0 90 0">
            <!-- Pool basin (tiled) -->
            <a-box position="0 -0.8 0" width="10" height="1.6" depth="8"
                material="src: #tiles; repeat: 4 4; color: #7fb5d0" shadow="receive: true"></a-box>
            <!-- Water surface (pool.jpg with animation) -->
            <a-plane position="0 0.1 0" rotation="-90 0 0" width="9.8" height="7.8"
                material="src: #water; opacity: 0.9; transparent: true; repeat: 2 2; roughness: 0.2; metalness: 0.1"
                water-animation="speed: 0.04"></a-plane>
            <!-- Pool edge coping -->
            <a-ring radius-outer="5.2" radius-inner="4.8" position="0 0.35 3.8" rotation="-90 0 0" color="#ccc"
                material="roughness: 0.4"></a-ring>
            <a-ring radius-outer="5.2" radius-inner="4.8" position="0 0.35 -3.8" rotation="-90 0 0"
                color="#ccc"></a-ring>
            <!-- Pool ladder -->
            <a-entity position="3 0.1 2">
                <a-box width="0.1" height="1.2" depth="0.1" color="#bbb"></a-box>
                <a-box position="0.3 0.5 0" width="0.1" height="0.8" depth="0.1" color="#bbb"></a-box>
            </a-entity>
        </a-entity>

        <!-- MODERN TREES & LANDSCAPING (enhanced) -->
        <a-entity position="-14 0 12">
            <a-cylinder radius="0.4" height="4" color="#5d4a36" shadow></a-cylinder>
            <a-sphere position="0 3.2 0" radius="1.5" material="src: #leaf; color: #3d9970" shadow></a-sphere>
            <a-sphere position="0.9 2.6 0.6" radius="1.0" material="src: #leaf; color: #3d9970"></a-sphere>
        </a-entity>
        <a-entity position="25 0 -10">
            <a-cylinder radius="0.4" height="4" color="#5d4a36" shadow></a-cylinder>
            <a-sphere position="0 3.2 0" radius="1.8" material="src: #leaf; color: #3d9970" shadow></a-sphere>
        </a-entity>
        <!-- Varied Scale Trees -->
        <a-entity position="-10 0 18" scale="1.2 1.2 1.2">
            <a-cylinder radius="0.4" height="4" color="#5d4a36" shadow></a-cylinder>
            <a-sphere position="0 3.2 0" radius="1.6" material="src: #leaf; color: #2e8b57" shadow></a-sphere>
        </a-entity>
        <a-entity position="25 0 10" scale="0.8 0.8 0.8">
            <a-cylinder radius="0.4" height="4" color="#5d4a36" shadow></a-cylinder>
            <a-sphere position="0 3.2 0" radius="1.5" material="src: #leaf; color: #3cb371" shadow></a-sphere>
        </a-entity>

        <!-- Subtle Ground Elevation -->
        <a-cylinder position="0 -1.9 -25" radius="60" height="4" color="#6b8e23" segments-radial="64"
            material="src: #grass; repeat: 20 20; roughness: 1"></a-cylinder>
        <!-- Additional bushes / plants -->
        <a-entity position="-18 0 5">
            <a-sphere radius="1.0" color="#2c5e2e" material="roughness: 0.8"></a-sphere>
            <a-sphere position="0.6 0.4 0.3" radius="0.7" color="#3d9970"></a-sphere>
        </a-entity>

        <!-- MODERN CAR (simplified but sleek) -->
        <a-entity id="modern-car" position="-16 0.5 -12" rotation="0 30 0"
            animation="property: position; from: -16 0.5 -12; to: 18 0.5 -10; dur: 12000; loop: true; dir: alternate; easing: easeInOutQuad">
            <!-- body -->
            <a-box width="3.2" height="0.6" depth="1.8" color="#2266aa" material="metalness: 0.6; roughness: 0.3"
                shadow></a-box>
            <a-box position="0 0.6 0.2" width="2.0" height="0.5" depth="1.2" color="#114477" material="metalness: 0.7"
                shadow></a-box>
            <!-- wheels -->
            <a-cylinder position="-1.1 0.2 0.8" radius="0.3" height="0.2" rotation="90 0 0" color="#222"
                shadow></a-cylinder>
            <a-cylinder position="1.1 0.2 0.8" radius="0.3" height="0.2" rotation="90 0 0" color="#222"
                shadow></a-cylinder>
            <a-cylinder position="-1.1 0.2 -0.8" radius="0.3" height="0.2" rotation="90 0 0" color="#222"
                shadow></a-cylinder>
            <a-cylinder position="1.1 0.2 -0.8" radius="0.3" height="0.2" rotation="90 0 0" color="#222"
                shadow></a-cylinder>
            <!-- headlights -->
            <a-sphere position="1.6 0.4 0.9" radius="0.15" color="#ffebc0"></a-sphere>
            <a-sphere position="-1.6 0.4 0.9" radius="0.15" color="#ffebc0"></a-sphere>
        </a-entity>

        <!-- PET (modern robotic dog with wagging tail) -->
        <a-entity id="pet-dog" position="4 0.3 9" rotation="0 20 0"
            animation="property: rotation; from: 0 20 0; to: 0 -20 0; loop: true; dir: alternate; dur: 2000">
            <!-- body -->
            <a-box width="0.5" height="0.3" depth="0.9" color="#aa88aa" material="metalness: 0.3" shadow></a-box>
            <!-- head -->
            <a-box position="0 0.3 0.4" width="0.4" height="0.4" depth="0.3" color="#886688" shadow></a-box>
            <!-- legs (existing) -->
            <a-entity position="0.2 0.1 -0.45"
                animation="property: rotation; from: -30 0 0; to: 30 0 0; loop: true; dir: alternate; dur: 200">
                <a-box width="0.1" height="0.3" depth="0.1" color="#886688"></a-box>
            </a-entity>
            <a-entity position="-0.2 0.1 -0.45"
                animation="property: rotation; from: 30 0 0; to: -30 0 0; loop: true; dir: alternate; dur: 200">
                <a-box width="0.1" height="0.3" depth="0.1" color="#886688"></a-box>
            </a-entity>
            <!-- ===== NEW: Wagging tail ===== -->
            <a-entity position="-0.15 0.15 -0.45" rotation="0 0 0">
                <a-box width="0.1" height="0.1" depth="0.3" color="#886688" shadow
                    animation="property: rotation; from: 20 0 0; to: -20 0 0; loop: true; dir: alternate; dur: 300"></a-box>
            </a-entity>
        </a-entity>

        <!-- CAMERA with smooth controls (Architectural Entry: Hallway) -->
        <a-entity id="rig" position="0 1.8 6" movement-controls="speed: 0.2">
            <a-entity camera position="0 1.6 0" look-controls>
                <a-cursor color="#4af" fuse="false"></a-cursor>
            </a-entity>
        </a-entity>

    </a-scene>
</body>

</html>
